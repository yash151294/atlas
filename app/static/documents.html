<!doctype html><title>Review</title><meta name=viewport content="width=device-width,initial-scale=1"><link rel=icon href="/static/favicon.svg"><link rel=stylesheet href="/static/base.css?v=20260916"><body><script src="/static/app.js?v=20260916"></script><main>
<h1>Review</h1><p class=sub>Every document is pseudonymised, checked and scored. Low-risk copies are approved by policy and the raw file's deletion clock starts. The few that need a person are queued with the reasons.</p>
<div class=split><div class=sticky>
<div class=tabs id=ltabs><a class=on onclick="tab('review',this)">Needs a person <span id=n1 class="tag peach"></span></a><a onclick="tab('all',this)">All <span id=n3 class="tag grey"></span></a></div>
<div id=list class=stagger></div></div>
<div><div id=doc><div class=empty>Select a document.</div></div></div></div>
<script>let DOCS=[],cur='review',sel=null,VIEWMODE='side';   /* the list tab, the open document and the view come back when you return to the page; revealed values never do */
async function list(){if(!DOCS.length)skeleton($('#list'),4);DOCS=await J('/api/docs');const rev=DOCS.filter(d=>d.tier==='review'&&!d.approved);$('#n1').textContent=rev.length;$('#n3').textContent=DOCS.length;render()}
function tab(t,el){cur=t;$$('#ltabs a').forEach(a=>a.classList.remove('on'));el.classList.add('on');render()}
function render(){const rows=cur==='review'?DOCS.filter(d=>d.tier==='review'&&!d.approved):DOCS;
 if(!rows.length){$('#list').innerHTML=`<div class=empty>${cur==='review'?'Nothing waiting. Every document passed the gate.':'Nothing here.'}</div>`;return}
 $('#list').innerHTML=rows.map(r=>{const why=JSON.parse(r.risk_reasons||'[]');const st=r.approved?(r.approval_mode==='auto'?'<span class=ok>approved by policy</span>':'<span class=ok>approved by '+esc(r.approved_by)+'</span>'):'<span class=warn>needs a person</span>';
  return `<div class="card click tight ${sel===r.doc_id?'sel':''}" onclick="open_('${r.doc_id}')"><div class=row style="justify-content:space-between;align-items:center;gap:8px"><div><b>${esc(r.project||'')}</b> <span class=muted>${fmtd(r.doc_date)} · ${r.doc_type}</span></div><span class=pill title="risk score; auto-approved below the threshold">risk ${(r.risk_score??0).toFixed(2)}</span></div>
  <div class=xs style="margin-top:2px">${r.source_token?`<span class="tok src">${r.source_token}</span> ${esc((r.source_descriptor||'').slice(0,50))}`:esc(r.filename)}</div>
  <div class=xs style="margin-top:3px">${st} · ${r.n_redactions} redactions</div>${why.length?'<ul class="reasons xs">'+why.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':''}</div>`}).join('')}
function mark(text,spans,hits){let out='',pos=0;for(const s of spans){if(s.start<pos)continue;out+=esc(text.slice(pos,s.start));const flag=s.needs_review&&!s.review_decision;out+=`<span class="hl hl-${s.type}${flag?' hl-review':''}" id="s${s.start}" title="${s.type}${s.role&&s.role!=='n/a'?' · '+s.role:''} · found by ${plain(s.detectors)} · confidence ${(s.confidence||0).toFixed(2)}">${esc(text.slice(s.start,s.end))}</span>`;pos=s.end}return out+esc(text.slice(pos))}
function markHits(text,hits){const hs=(hits||[]).filter(h=>h.text&&h.text.length>2).sort((a,b)=>b.text.length-a.text.length);if(!hs.length)return esc(text);
 const rx=new RegExp('(?<![\\w])(?:'+hs.map(h=>esc(h.text).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\w])','g');const kind={};hs.forEach(h=>kind[esc(h.text)]=plain(h.kind));
 return esc(text).replace(rx,m=>`<span class="hl hl-hit" title="possible residual identifier (${esc(kind[m]||'')})">${m}</span>`)}   /* one pass over the escaped text, before tokens become markup */
async function open_(id){for(const k in REVEALED)delete REVEALED[k];sel=id;render();skeleton($('#doc'),2,'Loading document…');const d=await J('/api/docs/doc?doc_id='+encodeURIComponent(id));const r=d.redacted;
 const flagged=d.spans.filter(s=>s.needs_review&&!s.review_decision&&s.type!=='ORG');const people=d.people||[];
 const status=r.approved?`<span class=ok>✓ ${r.approval_mode==='auto'?'Approved by policy':'Approved by '+esc(r.approved_by)} on ${fmtd(r.approved_at)}</span><div class="xs muted">raw file deleted after ${fmtd(r.raw_delete_after)}</div>`:`<button class=ok onclick="approve('${id}')">Approve retained copy</button>`;
 const why=(d.risk_reasons||[]);
 const checks=`<div class=card style="background:${r.tier==='review'&&!r.approved?'#fff8f3':'#f3fbf6'}"><div class=row style="justify-content:space-between;align-items:center"><div><b>Gate result:</b> risk ${(r.risk_score??0).toFixed(2)} → ${r.tier==='auto'?'<span class=ok>below threshold, approved by policy</span>':'<span class=warn>above threshold, a person decides</span>'}</div><div>${status}</div></div>
  ${why.length?'<ul class=small style="margin:6px 0 0;padding-left:18px">'+why.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':'<div class="small muted" style="margin-top:4px">No residual identifiers found by the rules engine or the second model; every detected value is gone from the retained copy.</div>'}`;
 const todo=flagged.length||d.residual_hits.length||d.queue.filter(x=>x.status==='pending').length;
 const tasks=`<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)"><b>Decisions</b> ${todo?'':'<span class="muted small">none needed</span>'}
  ${flagged.length?`<h3>${flagged.length} span${flagged.length>1?'s':''} found by one detector only</h3>`+flagged.map(s=>`<div class=decision><div><span class="hl hl-${s.type}">${esc(s.text)}</span> <span class="xs muted">${s.type}${s.role&&s.role!=='n/a'?' · '+s.role:''} · found by ${plain(s.detectors)} · confidence ${(s.confidence||0).toFixed(2)}</span></div><div><button class="sm ghost" onclick="span('${id}',${s.start},'confirm')">Keep redacted</button> <button class="sm ghost" onclick="span('${id}',${s.start},'restore')">Not personal data</button></div></div>`).join(''):''}
  ${d.residual_hits.length?`<h3>${d.residual_hits.length} possible residual identifier${d.residual_hits.length>1?'s':''} in the retained copy</h3>`+d.residual_hits.map(h=>`<div class=decision><div><span class="hl hl-hit">${esc(h.text)}</span> <span class="xs muted">${esc(plain(h.kind))}${h.informational?' · rules only, not scored':''}</span></div><button class="sm" onclick="redactText('${id}',${JSON.stringify(h.text).replace(/"/g,'&quot;')})">Redact it</button></div>`).join(''):''}
  ${d.queue.length?`<h3>Identity questions</h3>`+d.queue.map(x=>`<div class=decision><div>"${esc(x.mention)}" is <span class=b>${esc(x.candidate_name)}</span>? <span class="xs muted">${esc(x.reason)} · score ${x.score}${x.org_agrees?' · organisation agrees':''}</span></div><div>${x.status==='pending'?`<button class="sm ghost" onclick="decide('${id}','${esc(x.mention)}','confirmed')">Same person</button> <button class="sm ghost" onclick="decide('${id}','${esc(x.mention)}','rejected')">Different</button>`:'<span class="xs muted">'+esc(plain(x.status))+'</span>'}</div></div>`).join(''):''}
  ${d.vault.filter(v=>v.role==='manual').length?`<h3>Manual redactions</h3>`+d.vault.filter(v=>v.role==='manual').map(v=>`<div class=decision><div><span class=tok>${v.token}</span> <span class="xs muted">${v.type} · added by a reviewer${v.entity_id?' · same person as the extraction found':''}</span></div>${v.entity_id?'':`<button class="sm ghost" onclick="unredact('${id}','${v.token}')">Undo</button>`}</div>`).join(''):''}
  <div class="xs muted" style="margin-top:8px">Missed something? Select text in the raw copy and press <kbd>R</kbd> to redact it. Whole words only; organisation names are kept.</div></div></div>`;
 const who=`<div class="card tight"><b class=small>Who is who in this document</b> <span class="xs muted">what the search index and the research desk see</span><div class=small style="margin-top:4px">${people.map(p=>`<span class="tok ${KIND[p.kind]||''}">${p.token}</span> <span class=xs>${p.kind==='private'?'<span class=muted>private individual, redacted</span>':(p.kind==='source'?'the source, ':p.kind==='contributor'?'the contributor':'')+esc(p.descriptor)+(p.relationship?' <span class=muted>('+esc(p.relationship)+')</span>':'')}</span>`).join(' &nbsp; ')}</div></div>`;
 $('#doc').innerHTML=`<div class="card tight"><div class=row style="justify-content:space-between;align-items:center;gap:8px"><div><b>${esc(r.filename)}</b> <span class="small muted">${esc(r.project||'')} · ${fmtd(r.doc_date)} · ${r.doc_type}</span></div><a class=small style="white-space:nowrap" href="/network?q=${encodeURIComponent(r.source_descriptor||'')}">see in network</a></div></div>${checks}${tasks}${who}
 <div class=tabs><a class=on onclick="view('side',this)">Side by side</a><a onclick="view('retained',this)">Retained copy only</a></div>
 <div class="xs muted legend" style="margin:0 0 10px"><i style="background:#ffd7d0"></i>person <i style="background:#d9e8ff"></i>organisation <i style="background:#ffe9b3"></i>contact/ID <i style="background:#e6d6ff"></i>financial/family/nationality <i style="border:2px dashed #c33"></i>needs a decision <span style="margin-left:10px">· click a token in the retained copy to reveal it (logged, reason required)</span></div>
 <div class="row panes" id=side><div class=col><div class="small muted cap">Raw, as submitted · ${d.spans.length} spans found</div><pre id=raw class="small text">${mark(d.raw_text,d.spans)}</pre></div>
 <div class=col id=retcol><div class="small muted cap">Retained, pseudonymised · ${d.vault.length} vault entries, expire ${fmtd(d.vault[0]?d.vault[0].expires:'')}</div><div id=rvl class="small" style="background:#FFF8E6;border:1px solid #F0D9A0;border-radius:10px;padding:8px 12px;margin:6px 0" hidden></div><pre class="small text">${tokenise(r.redacted_text,people,'revealTok',d.residual_hits)}</pre></div></div>`;
 if(VIEWMODE==='retained')view('retained',$$('#doc .tabs a')[1]);window.CUR=id;$('#raw').onkeydown=null;document.onkeydown=e=>{if(e.key==='r'||e.key==='R'){const t=window.getSelection().toString().trim();if(t&&window.CUR)redactText(window.CUR,t)}};$('#raw').tabIndex=0}
function view(v,el){VIEWMODE=v;$$('#doc .tabs a').forEach(a=>a.classList.remove('on'));el.classList.add('on');$('#raw').parentElement.hidden=v==='retained';$('#side').classList.toggle('one',v==='retained')}
const REVEALED={};   /* token -> value for the open document, shown until hidden; the server logs every reveal */
async function revealTok(tok){if(REVEALED[tok]){toast(tok+' = '+REVEALED[tok]);return}const r=await reveal(tok,window.CUR);if(!r)return;
 REVEALED[tok]=r.value;$$('#retcol .tok').forEach(el=>{if(el.textContent.startsWith(tok)&&!el.querySelector('.rv'))el.insertAdjacentHTML('beforeend',` <span class=rv>${esc(r.value)}</span>`)});
 $('#rvl').innerHTML='<b>Revealed in this session</b> (logged with your name): '+Object.entries(REVEALED).map(([t,v])=>`<span class="tok">${t}</span> = <span class=rv>${esc(v)}</span>`).join(' &nbsp; ')+` <button class="sm ghost" onclick="hideReveals()">hide</button>`;$('#rvl').hidden=false;}
function hideReveals(){for(const k in REVEALED)delete REVEALED[k];$$('#retcol .rv').forEach(e=>e.remove());$('#rvl').hidden=true}
async function approve(id){await POST('/api/docs/approve?doc_id='+encodeURIComponent(id));toast('Approved. Raw file deletion clock started.');await list();open_(id)}
async function span(id,start,dec){spinner($('#doc'),dec==='restore'?'Restoring text and rebuilding the index for this document…':'Recording decision…');await POST('/api/docs/span?doc_id='+encodeURIComponent(id)+'&start='+start+'&decision='+dec);await list();open_(id)}
async function redactText(id,text){if(!confirm('Redact every occurrence of "'+text+'" in this document?'))return;spinner($('#doc'),'Redacting and rebuilding the index for this document…');const r=await POST('/api/docs/redact_text?doc_id='+encodeURIComponent(id)+'&text='+encodeURIComponent(text));if(!r.ok)toast(r.error,false);await list();open_(id)}
async function unredact(id,tok){if(!confirm('Undo the manual redaction '+tok+'? The original text returns to the retained copy.'))return;spinner($('#doc'),'Restoring text and rebuilding the index for this document…');const r=await POST('/api/docs/unredact?doc_id='+encodeURIComponent(id)+'&token='+encodeURIComponent(tok));if(!r.ok)toast(r.error,false);await list();open_(id)}
async function decide(id,m,dec){spinner($('#doc'),'Applying the identity decision and re-running this document…');await POST('/api/docs/queue?doc_id='+encodeURIComponent(id)+'&mention='+encodeURIComponent(m)+'&decision='+dec);await list();open_(id)}
addEventListener('pagehide',()=>mem.set('atlas.review',{tab:cur,doc:sel,view:VIEWMODE}));
list().then(()=>{const d=new URLSearchParams(location.search).get('doc'),S=d?null:mem.get('atlas.review');   /* a link with ?doc= wins over what was left open */
 if(d){tab('all',$$('#ltabs a')[1]);open_(d);return}if(!S)return;VIEWMODE=S.view||'side';const all=S.tab==='all';tab(all?'all':'review',$$('#ltabs a')[all?1:0]);
 if(S.doc&&DOCS.some(x=>x.doc_id===S.doc))open_(S.doc)});   /* a document that has gone since falls back to the list */</script></main>
